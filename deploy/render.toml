# DocScout settings for the hosted daily job (docscout.hosted.job on Render).
# Secrets aren't here: GITHUB_TOKEN, DOCSCOUT_LLM_API_KEY and MONGODB_URI come from
# Render's environment variables.

[profile]
api_types = ["rest"]
languages = []
language_filter = "auto"
project_sizes = ["small", "medium", "large"]

# A server has no laptop to keep free, so each run checks more than the defaults (60 repos,
# 11 reviews, 10 new items). These are caps: on 16 Oct, 60 repos gave 3 projects for Gemma.
[discovery]
daily_repo_budget = 200         # about 660 GitHub requests, well under the 5,000 an hour

[llm]
# Gemma 4 31B through Google's OpenAI-compatible Gemini API endpoint.
provider = "openai_compatible"
model = "gemma-4-31b-it"
fallback_model = "gemma-4-26b-a4b-it"  # when the 31B is busy or down after its retries (5, 20 and 60 s)
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
timeout_seconds = 90            # a review takes 20-40 s; a request that hangs is retried after a pause
reviews_per_run = 30            # the rest wait for the next run

[storage]
backend = "atlas"               # DocScout's memory in Atlas collections: a cron job starts on an empty machine

[report]
dir = "/tmp/docscout-reports"   # the website reads the picks from Atlas, not these files
max_items = 30                  # as many as Gemma can review, so every accepted project is published that day

[notifications]
run_started = false             # no desktop on a server
run_finished = false
