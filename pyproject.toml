[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docscout"
version = "0.1.0"
description = "Finds open-source REST APIs with poor documentation that you can contribute to."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2.6",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The hosted version (docscout.hosted): website, daily job on Render, MongoDB Atlas.
hosted = ["starlette>=1.8", "jinja2>=3.1", "uvicorn>=0.54", "pymongo>=4.19"]

[project.scripts]
docscout = "docscout.cli:main"

[project.gui-scripts]
docscout-bg = "docscout.cli:main_bg"

[tool.setuptools.packages.find]
include = ["docscout*"]

[tool.setuptools.package-data]
docscout = ["default_config.toml", "hosted/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
